name: Tom Son Nex Doc EKS

on: workflow_dispatch

jobs:
  Build-Stage:
    runs-on: self-hosted

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup the Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run the Goal
        run: mvn clean package

      - name: Display the war file
        run: ls -l target/

      - name: Upload the Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-war
          path: target/*.war

  Test-Stage:
    runs-on: self-hosted
    needs: Build-Stage

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup the java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run the Test Goal
        run: mvn test

      - name: Status of the gaol
        run: echo "All Test cases are successfully passed"

  Nexus-Stage:
    runs-on: self-hosted
    needs: Test-Stage

    env:
      NEXUS_USERNAME: admin
      NEXUS_PASSWORD: apple

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Create Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
            <server>
              <id>nexus</id>
              <username>${NEXUS_USERNAME}</username>
              <password>${NEXUS_PASSWORD}</password>
            </server>
          </servers>
          </settings>
          EOF

      - name: Verify settings.xml
        run: cat ~/.m2/settings.xml

      - name: Deploy Artifact to Nexus
        run: mvn clean deploy

      - name: Upload Status
        run: echo "WAR file uploaded successfully to Nexus Repository."

  Docker-Stage:
    runs-on: self-hosted
    needs: Nexus-Stage

    steps:
      - name: Check the Code
        uses: actions/checkout@v4
        
      - name: Setup the Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Download the Artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-war
          path: target

      - name: Display the Artifact
        run: |
          pwd
          ls -l target/

      - name: Docker Built the image
        run: docker build -t anildocker11/maven-nexus-docker:0.0.1 .

      - name: Docker Push the DockerHub
        run: docker push anildocker11/maven-nexus-docker:0.0.1

      - name: Docker status
        run: echo "Docker buil, push all things done successfully."

  Kubernetes-EKS-Stage:
    runs-on: self-hosted
    needs: Docker-Stage

    steps:
      - name: Check out the Code
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name my-k8s-cluster

      - name: Verify the EKS Cluster
        run: |
          kubectl get nodes
          kubectl get ns

      - name: Create a NameSpace
        run: kubectl create ns anil

      - name: Deployment the Application
        run: |
          kubectl apply -f dep.yaml

      - name: Status of Deployment Application
        run: |
          kubectl get deployment
          kubectl get svc
          kubectl get po
          kubectl get all


          
