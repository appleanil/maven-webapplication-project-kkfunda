name: Tom Son Nex Doc EKS

on: workflow_dispatch

jobs:
  Build-Stage:
    runs-on: self-hosted

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup the Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run the Goal
        run: mvn clean package

      - name: Display the war file
        run: ls -l target/

      - name: Upload the Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-war
          path: target/*.war

  Test-Stage:
    runs-on: self-hosted
    needs: Build-Stage

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup the java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run the Test Goal
        run: mvn test

      - name: Status of the gaol
        run: echo "All Test cases are successfully passed"

  Deploy-Tomcat:
    runs-on: self-hosted
    needs: Test-Stage

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Download the Artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-war
          path: target

      - name: Display the Artifact
        run: ls -l target/

      - name: Deploy into Tomcat Application
        run: |
          WAR_FILE=$(find target -name "*.war" | head -1)

          echo "Deploying: $WAR_FILE"
          
          curl -v -u "admin:admin" \
          --upload-file "$WAR_FILE" \
          "http://43.204.219.200:8080/manager/text/deploy?path=/maven-web-application&update=true"

      - name: Status of war file
        run: echo "Application successfully deployed into Tomcat."

  SonarQube:
    runs-on: self-hosted
    needs: Deploy-Tomcat

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SonarQube Code Qulilty
        run: |
           mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=http://43.204.219.200:9000 \
            -Dsonar.projectKey=maven-webapplication-project-kkfunda \
            -Dsonar.token=squ_b669ec4c009dd8334b5a28253df90f9b596ded73
















      
