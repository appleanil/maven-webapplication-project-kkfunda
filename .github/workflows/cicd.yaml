name: Tom Son Nex Doc EKS

on: workflow_dispatch

jobs:
  Build-Stage:
    runs-on: self-hosted

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup the Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run the Goal
        run: mvn clean package

      - name: Display the war file
        run: ls -l target/

      - name: Upload the Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-war
          path: target/*.war

  Test-Stage:
    runs-on: self-hosted
    needs: Build-Stage

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup the java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run the Test Goal
        run: mvn test

      - name: Status of the gaol
        run: echo "All Test cases are successfully passed"

  Nexus-Stage:
    runs-on: self-hosted
    needs: Test-Stage

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Create Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>admin</username>
                <password>apple</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Verify settings.xml
        run: |
          cat ~/.m2/settings.xml

      - name: Deploy Artifact to Nexus
        run: mvn clean deploy

      - name: Upload Status
        run: echo "WAR file uploaded successfully to Nexus Repository."
